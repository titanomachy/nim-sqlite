name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        nim: [ devel, stable ]
        os: [ ubuntu-latest ]
        include:
          - os: windows-latest
            nim: stable
          - os: macos-latest
            nim: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache Nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-v2-${{ runner.os }}-${{ matrix.nim }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nimble-v2-${{ runner.os }}-${{ matrix.nim }}-
            nimble-v2-${{ runner.os }}-
        if: runner.os != 'Windows'

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: nimble test -Y

      - name: Verify installation
        run: nimble install -Y
