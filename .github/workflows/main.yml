name: CI

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        nim: [ devel, stable ]
        os: [ ubuntu-latest ]
        include:
          - os: windows-latest
            nim: stable
          - os: macos-latest
            nim: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache Nimble packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nimble
          key: nimble-v2-${{ runner.os }}-${{ matrix.nim }}-${{ hashFiles('*.nimble') }}
          restore-keys: |
            nimble-v2-${{ runner.os }}-${{ matrix.nim }}-
        if: runner.os != 'Windows'

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@3a60cf06f20c1cf3a9becf76b30288c0361d5f1e # v2.2.2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: nimble test -Y

      - name: Run examples
        run: nimble examples -Y

      - name: Verify installation
        run: nimble install -Y

  hardening:
    name: Hardening / ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal-orc
            flags: --mm:orc
          - name: release-orc
            flags: --mm:orc -d:release
          - name: danger-orc
            flags: --mm:orc -d:danger
          - name: normal-arc
            flags: --mm:arc
          - name: release-arc
            flags: --mm:arc -d:release
          - name: danger-arc
            flags: --mm:arc -d:danger
          - name: address-sanitizer
            flags: --mm:orc --passC:-fsanitize=address --passC:-fno-omit-frame-pointer --passL:-fsanitize=address
          - name: undefined-behavior-sanitizer
            flags: --mm:orc --passC:-fsanitize=undefined --passC:-fno-sanitize-recover=undefined --passL:-fsanitize=undefined

    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@3a60cf06f20c1cf3a9becf76b30288c0361d5f1e # v2.2.2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: nimble install --depsOnly -Y

      - name: Run ${{ matrix.name }} tests
        run: >-
          nim c -r
          --path:src
          --nimcache:build/nimcache/${{ matrix.name }}
          --out:build/tests-${{ matrix.name }}
          ${{ matrix.flags }}
          tests/tests.nim

  documentation:
    name: Documentation and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Nim
        uses: jiro4989/setup-nim-action@3a60cf06f20c1cf3a9becf76b30288c0361d5f1e # v2.2.2
        with:
          nim-version: "2.2.10"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install lcov 2.1
        run: |
          sudo apt-get update
          sudo apt-get remove -y lcov || true
          sudo apt-get install -y libperlio-gzip-perl libjson-pp-perl libcapture-tiny-perl libdatetime-perl
          wget https://github.com/linux-test-project/lcov/releases/download/v2.1/lcov-2.1.tar.gz
          tar -xzf lcov-2.1.tar.gz
          cd lcov-2.1
          sudo make install

      - name: Install dependencies
        run: nimble install --depsOnly -Y

      - name: Build documentation
        run: nimble docs

      - name: Verify generated documentation
        run: git diff --exit-code -- docs/index.html docs/nimdoc.out.css

      - name: Run tests and generate coverage
        run: nimble coverage

      - name: Enforce minimum coverage
        run: |
          awk -F: -v minimum=80 '
            /^LH:/ { covered += $2 }
            /^LF:/ { total += $2 }
            END {
              if (total == 0) {
                print "No coverage data found"
                exit 2
              }

              percent = covered * 100 / total
              printf "Line coverage: %.1f%%\n", percent

              if (percent < minimum) {
                printf "Coverage is below %.1f%%\n", minimum
                exit 1
              }
            }
          ' coverage.info

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
